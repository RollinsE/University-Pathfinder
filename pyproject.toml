[project]
name = "campus-pathfinder"
version = "2.0.0"
description = "Recognise buildings on Bournemouth University's Talbot Campus from a photo: two classifiers, a YOLO11 detector and an in-browser web app."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # long log messages; the formatter handles code

[tool.ruff.lint.isort]
known-first-party = ["src"]
